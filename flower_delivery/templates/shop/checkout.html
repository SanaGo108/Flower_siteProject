{% extends "shop/base.html" %}

{% block title %}Оформление заказа{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Оформление заказа</h1>

    <!-- 🔍 Отображение сообщений Django -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- 🚀 Форма заказа -->
    <form id="checkout-form" method="post" action="{% url 'checkout' %}" class="p-4 shadow rounded">
        {% csrf_token %}  <!-- ✅ CSRF-токен для защиты -->

        <div class="mb-3">
            <label for="delivery_date" class="form-label">📅 Дата доставки</label>
            <input type="date" id="delivery_date" name="delivery_date" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="delivery_time" class="form-label">⏰ Время доставки</label>
            <input type="time" id="delivery_time" name="delivery_time" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="delivery_address" class="form-label">📍 Адрес доставки</label>
            <textarea id="delivery_address" name="delivery_address" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label for="comment" class="form-label">📝 Комментарий (необязательно)</label>
            <textarea id="comment" name="comment" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" id="submit-button" class="btn btn-primary w-100">Оформить заказ</button>
    </form>

    <!-- 🔍 Для отладки -->
    <p id="debug-info" style="display: none; color: red;"></p>
</div>

<!-- ✅ Стили -->
<style>
    .btn-primary {
        background-color: #ff69b4;
        border-color: #ff69b4;
        font-size: 16px;
        font-weight: bold;
    }

    .btn-primary:hover {
        background-color: #ff85c2;
        border-color: #ff85c2;
    }

    .btn-primary:disabled {
        background-color: #ffc0cb;
        cursor: not-allowed;
    }
</style>

<!-- ✅ Скрипты -->
<script>
    document.getElementById("checkout-form").addEventListener("submit", function (event) {
        console.log("🚀 Форма отправляется!");
    });
</script>

{% endblock %}
