{% extends "shop/base.html" %}

{% block title %}Профиль пользователя{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Профиль пользователя</h1>
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title">Здравствуйте, {{ user.username }}!</h5>
            <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>

            <form method="post" action="{% url 'profile' %}" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_telegram_username" class="form-label">Telegram Username</label>
                    <input type="text" name="telegram_username" id="id_telegram_username"
                           class="form-control" value="{{ user.profile.telegram_username }}" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Сохранить изменения</button>
            </form>

            <a href="{% url 'logout' %}" class="btn btn-outline-danger mt-3 w-100">Выйти</a>
        </div>
    </div>
</div>
{% endblock %}
