{% extends "shop/base.html" %}

{% block title %}Профиль пользователя{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Профиль пользователя</h1>
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title">Здравствуйте, {{ user.username }}!</h5>
            <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>

            <!-- Форма сохранения chat_id -->
            <form method="post" action="{% url 'profile' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_chat_id" class="form-label">Ваш chat_id:</label>
                    <input type="text" name="chat_id" id="id_chat_id" class="form-control"
                           value="{{ user.profile.chat_id }}" required>
                </div>
                <button type="submit" class="btn btn-pink w-100">Сохранить</button>
            </form>

            <!-- КНОПКА ВЫХОДА -->
            <form method="post" action="{% url 'logout' %}" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger w-100">Выйти</button>
            </form>
        </div>
    </div>
</div>

<!-- Стили для кнопки -->
<style>
    .btn-pink {
        background-color: #ff69b4; /* Розовый */
        border-color: #ff69b4;
        color: white;
    }

    .btn-pink:hover {
        background-color: #ff1493;
        border-color: #ff1493;
        color: white;
    }
</style>

{% endblock %}
